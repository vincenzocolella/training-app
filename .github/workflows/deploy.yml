name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔍 DIAGNOSTIC STEP: This prints your folder layout to the log
      - name: List files in repository
        run: |
          echo "=== Top Level Files ==="
          ls -la
          echo "=== Looking deeper ==="
          ls -R | grep -v 'node_modules' | head -n 30

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # We will let this run, but if it fails, the "List files" step above will tell us exactly why
      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build

      - name: Upload Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
