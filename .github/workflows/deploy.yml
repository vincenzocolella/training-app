name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🧠 SMART STEP: Finds package.json dynamically, installs, and builds there
      - name: Locate and Build Project
        run: |
          TARGET_DIR=$(find . -name package.json -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "🎯 Target project folder discovered at: $TARGET_DIR"
          
          cd "$TARGET_DIR"
          npm install
          npm run build
          
          # Move the compiled assets out to the root workspace so the deployer can see them
          if [ "$TARGET_DIR" != "." ]; then
            echo "📦 Migrating build artifact to root directory..."
            mv dist "$GITHUB_WORKSPACE/dist"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          path: './dist' # Always deploys from the root workspace folder
