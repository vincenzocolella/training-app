name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./rome-marathon # 👈 1. Change this if your subfolder is named something else (e.g., ./vite-project)

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build

      - name: Upload Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './rome-marathon/dist' # 👈 2. Make sure this matches your subfolder name too!

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
